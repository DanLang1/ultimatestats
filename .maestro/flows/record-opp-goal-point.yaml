appId: com.langdk.ultimatestats
name: Record Opponent Goal Point
---
# Tap a player to start with disc (if not already started)
- tapOn:
    id: 'tracker-chip-Joe'
    optional: true

# Open rare menu and record an opponent block to give them the disc
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- assertVisible:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'rare-menu-opp-d'

# Now opponent has disc; bottom card shows defense actions
- assertVisible:
    text: 'OPP GOAL'
    optional: true
- assertVisible:
    text: 'OPP TURN'
    optional: true

# Record opponent goal
- tapOn:
    id: 'defense-opp-goal'

# Point ends; verify next point button appears
- assertVisible:
    id: 'tracker-next-point'
- tapOn:
    id: 'tracker-next-point'

# After next point, land on line selection screen
- assertVisible:
    text: 'Select Line'
    optional: true
- assertVisible:
    text: 'Starting Line'
    optional: true

# Select 7 players for the line
- tapOn:
    id: 'player-chip-Joe'
- tapOn:
    id: 'player-chip-Jon'
- tapOn:
    id: 'player-chip-Mike'
- tapOn:
    id: 'player-chip-Molly'
- tapOn:
    id: 'player-chip-Kelly'
- tapOn:
    id: 'player-chip-Rachel'
- tapOn:
    id: 'player-chip-Joel'

# Confirm line selection
- tapOn:
    id: 'line-select-confirm'

# Handle pull tracking
- tapOn:
    id: 'pull-skip-timing'
- tapOn:
    id: 'pull-result-inbound'
    optional: true
- tapOn:
    id: 'pull-result-ob'
    optional: true

# Wait for tracker screen
- assertVisible:
    text: 'TAP WHO STARTS WITH DISC'
    optional: true
- assertVisible:
    text: 'DEFENSE'
    optional: true
