appId: com.langdk.ultimatestats
name: Seed Scrimmage Tracker Game From Clean Process
---
- launchApp
- openLink: ultimatestats:///__maestro_seed__?gameType=scrimmage&trackerState=${TRACKER_STATE}
- runFlow:
    when:
      visible: 'U-Stat (Dev)'
    commands:
      - tapOn: 'U-Stat (Dev)'
      - extendedWaitUntil:
          notVisible: 'DEVELOPMENT SERVERS'
          timeout: 15000
      - openLink: ultimatestats:///__maestro_seed__?gameType=scrimmage&trackerState=${TRACKER_STATE}
- extendedWaitUntil:
    visible:
      id: 'maestro-setup-running'
    timeout: 5000
- retry:
    maxRetries: 1
    commands:
      - extendedWaitUntil:
          notVisible:
            id: 'maestro-setup-running'
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'tracker-menu-button'
    timeout: 15000
- assertVisible:
    text: 'LIGHT'
- assertVisible:
    text: 'DARK'
- assertVisible:
    id: 'tracker-chip-Joe'
- assertNotVisible:
    id: 'tracker-chip-Anna'
