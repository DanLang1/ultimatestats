appId: com.langdk.ultimatestats
name: Seed Advanced Tracker Game
---
- openLink: ultimatestats:///__maestro_seed__?trackerState=${TRACKER_STATE}
- extendedWaitUntil:
    visible:
      id: 'maestro-setup-running'
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: 'maestro-setup-running'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'tracker-menu-button'
    timeout: 15000
