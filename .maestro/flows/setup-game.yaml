appId: com.langdk.ultimatestats
name: Seed Advanced Tracker Game
---
- stopApp:
    optional: false
- launchApp
- openLink: ultimatestats:///__maestro_seed__

- extendedWaitUntil:
    visible:
      id: 'maestro-setup-ready'
    timeout: 15000
- tapOn:
    id: 'maestro-setup-ready'
- extendedWaitUntil:
    visible:
      id: 'tracker-menu-button'
    timeout: 15000
- assertVisible:
    text: 'TAP WHO STARTS WITH DISC'
