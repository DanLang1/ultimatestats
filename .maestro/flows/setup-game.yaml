appId: com.langdk.ultimatestats
name: Setup Advanced Tracker Game
---
# Ensure fresh app start
- stopApp
- launchApp

# Navigate to advanced tracker pre-game
- scrollUntilVisible:
    element:
      id: 'advanced-tracker-new-game-button'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 10
- tapOn:
    id: 'advanced-tracker-new-game-button'
- assertVisible:
    text: 'ADVANCED TRACKER'

# Select receiving team (Zoboomafoo = "us")
- tapOn:
    text: 'Zoboomafoo'

# If gender ratio is enabled, select a ratio so Set Line is enabled
- tapOn:
    text: 'FMP Majority'
    optional: true

# Tap Set Line to proceed to line selection
- tapOn:
    id: 'advanced-tracker-set-line-button'

# Wait for line selection screen
- assertVisible:
    text: 'Starting Line'

# Select 7 players for the line
- tapOn:
    id: 'player-chip-Joe'
- tapOn:
    id: 'player-chip-Jon'
- tapOn:
    id: 'player-chip-Mike'
- tapOn:
    id: 'player-chip-Molly'
- tapOn:
    id: 'player-chip-Kelly'
- tapOn:
    id: 'player-chip-Rachel'
- tapOn:
    id: 'player-chip-Joel'

# Confirm line selection
- tapOn:
    id: 'line-select-confirm'

# Handle pull tracking - they are pulling since we are receiving
- assertVisible:
    text: 'THEY ARE PULLING'
    optional: true
- assertVisible:
    text: 'WE ARE PULLING'
    optional: true

# Skip pull timing
- tapOn:
    id: 'pull-skip-timing'

# Select a pull result
- tapOn:
    id: 'pull-result-ib'
    optional: true
- tapOn:
    id: 'pull-result-ob'
    optional: true

# Wait for tracker screen
- assertVisible:
    text: 'TAP WHO STARTS WITH DISC'
    optional: true
- assertVisible:
    text: 'DEFENSE'
    optional: true
