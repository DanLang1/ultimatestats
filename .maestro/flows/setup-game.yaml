appId: com.langdk.ultimatestats.dev
name: Seed Advanced Tracker Game
---
- launchApp
# Retry once: a deep link sent during app cold start can be dropped.
# maxRetries counts total attempts in maestro-runner but retries in Maestro; 2 retries in both.
- retry:
    maxRetries: 2
    commands:
      - openLink: ultimatestats-dev:///__maestro_seed__?trackerState=${TRACKER_STATE}
      - extendedWaitUntil:
          visible:
            id: 'maestro-setup-running'
          timeout: 5000
- retry:
    maxRetries: 1
    commands:
      - extendedWaitUntil:
          notVisible:
            id: 'maestro-setup-running'
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'tracker-menu-button'
    timeout: 15000
