appId: com.langdk.ultimatestats
name: Seed Advanced Tracker Game From Clean Process
---
- stopApp
- openLink: ultimatestats:///__maestro_seed__?trackerState=${TRACKER_STATE}
- runFlow:
    when:
      visible: 'U-Stat (Dev)'
    commands:
      - tapOn: 'U-Stat (Dev)'
      - extendedWaitUntil:
          notVisible: 'DEVELOPMENT SERVERS'
          timeout: 15000
      - openLink: ultimatestats:///__maestro_seed__?trackerState=${TRACKER_STATE}
- extendedWaitUntil:
    visible:
      id: 'maestro-setup-running'
    timeout: 5000
- retry:
    maxRetries: 1
    commands:
      - extendedWaitUntil:
          notVisible:
            id: 'maestro-setup-running'
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'tracker-menu-button'
    timeout: 15000
