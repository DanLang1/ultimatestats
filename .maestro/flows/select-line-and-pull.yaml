appId: com.langdk.ultimatestats.dev
name: Select Line and Handle Pull (Deterministic)
---
# After next point, we land on line selection screen.
# Header now includes point type and score, e.g. "O-Point · 0-1".
- assertVisible:
    id: 'line-select-title'

# Reload the previous point's line. Every seed line holds the same seven players, so the
# newest recent line is always a full line; manual chip selection is covered by the UI setup
# and preset flows.
- tapOn:
    id: 'line-select-load-line'
- tapOn:
    id: 'line-select-recent-.*'
    index: 0
- assertVisible:
    id: 'line-select-confirm'
    enabled: true

# Confirm line selection
- tapOn:
    id: 'line-select-confirm'

# Handle pull tracking - skip timing
- tapOn:
    id: 'pull-skip-timing'

# Pull result step only appears when WE are pulling.
- runFlow:
    when:
      visible:
        id: 'pull-result-inbound'
    commands:
      - tapOn:
          id: 'pull-result-inbound'

# Verify on tracker (card text varies: TAP WHO HAS THE DISC when we have disc,
# DEFENSE or turnover header when opponent has disc after our pull)
- assertVisible:
    id: 'tracker-menu-button'
