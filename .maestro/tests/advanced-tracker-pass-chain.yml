appId: com.langdk.ultimatestats
name: Advanced Tracker Pass Chain and Goal
---
- runFlow:
    file: ../flows/setup-game.yaml

# Start with disc on Joe
- tapOn:
    id: 'tracker-chip-Joe'

# Pass to Jon
- tapOn:
    id: 'tracker-chip-Jon'
- assertVisible:
    text: 'JOE'

# Pass to Mike
- tapOn:
    id: 'tracker-chip-Mike'
- assertVisible:
    text: 'JON'

# Opponent block and goal to end point
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'tracker-next-point'
- tapOn:
    id: 'tracker-next-point'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# Point 2: Quick goal
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'tracker-next-point'
- tapOn:
    id: 'tracker-next-point'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# Point 3: Longer pass chain then goal
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'
- tapOn:
    id: 'tracker-chip-Mike'
- tapOn:
    id: 'tracker-chip-Molly'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'tracker-next-point'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-pass-chain
