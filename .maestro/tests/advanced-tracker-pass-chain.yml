appId: com.langdk.ultimatestats.dev
name: Advanced Tracker Pass Chain and Goal
tags:
  - extended
---
- runFlow:
    file: ../flows/setup-game-clean.yaml
    env:
      TRACKER_STATE: focusPossession

# Pass to Jon
- tapOn:
    id: 'tracker-chip-Jon'
- assertVisible:
    text: 'JOE'

# Pass to Mike
- tapOn:
    id: 'tracker-chip-Mike'
- assertVisible:
    text: 'JON'

# Opponent block and goal to end point
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml
- runFlow:
    file: ../flows/record-opponent-goal.yaml
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# Point 2: Quick goal
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml
- runFlow:
    file: ../flows/record-opponent-goal.yaml
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# Point 3: Longer pass chain then goal
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'
- tapOn:
    id: 'tracker-chip-Mike'
- tapOn:
    id: 'tracker-chip-Molly'
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml
- runFlow:
    file: ../flows/record-opponent-goal.yaml

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-pass-chain
