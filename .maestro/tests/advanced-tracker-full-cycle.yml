appId: com.langdk.ultimatestats.dev
name: Advanced Tracker Full Point Cycle
tags:
  - extended
---
- runFlow:
    file: ../flows/setup-game.yaml
    env:
      TRACKER_STATE: focusPossession

# === POINT 1: Opponent goal ===
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml
- runFlow:
    file: ../flows/record-opponent-goal.yaml
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# === POINT 2: Opponent goal ===
- tapOn:
    id: 'tracker-chip-Joe'
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml
- runFlow:
    file: ../flows/record-opponent-goal.yaml
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# === POINT 3: Pass chain then opponent goal ===
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml
- runFlow:
    file: ../flows/record-opponent-goal.yaml
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# === POINT 4: Longer pass chain then opponent goal ===
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'
- tapOn:
    id: 'tracker-chip-Mike'
- tapOn:
    id: 'tracker-chip-Molly'
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml
- runFlow:
    file: ../flows/record-opponent-goal.yaml

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-full-cycle
