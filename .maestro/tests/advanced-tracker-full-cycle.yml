appId: com.langdk.ultimatestats
name: Advanced Tracker Full Point Cycle
---
- runFlow:
    file: ../flows/setup-game.yaml

# === POINT 1: Opponent goal ===
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# === POINT 2: Opponent goal ===
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# === POINT 3: Pass chain then opponent goal ===
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# === POINT 4: Longer pass chain then opponent goal ===
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'
- tapOn:
    id: 'tracker-chip-Mike'
- tapOn:
    id: 'tracker-chip-Molly'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-full-cycle
