appId: com.langdk.ultimatestats
name: Advanced Tracker Rare Actions
---
- runFlow:
    file: ../flows/setup-game.yaml

# --- Stall (Offense) ---
- tapOn:
    id: 'tracker-chip-Joe'

# Open rare menu, select Stall (Offense)
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-stall-offense'

# Stall-offense records a turnover, opponent gets disc
- waitForAnimationToEnd:
    timeout: 1500

# Record opponent goal to end point
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# --- Callahan ---
- tapOn:
    id: 'tracker-chip-Joe'

# Give disc to opponent via Opp D
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'

# Now opponent has disc, open rare menu for Callahan
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-callahan'

# Verify Callahan prompt
- assertVisible:
    text: 'Tap player who got the Callahan'

# Tap Jon for Callahan
- tapOn:
    id: 'tracker-chip-Jon'

# Verify goal state
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# --- Stall (Defense) ---
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'

# Opp D to give opponent disc
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'

# Open rare menu for Stall (Defense)
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-stall'

# Verify stall prompt
- assertVisible:
    text: 'Tap player who got the stall'

# Tap Joe for stall
- tapOn:
    id: 'tracker-chip-Joe'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-rare-actions
