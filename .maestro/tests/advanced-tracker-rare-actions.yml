appId: com.langdk.ultimatestats
name: Advanced Tracker Rare Actions
---
# Reuse setup flow to get to tracker screen
- runFlow:
    file: ../flows/setup-game.yaml

# --- Stall (offense - focus has disc) ---
# Tap Joe to start with disc
- tapOn:
    id: 'tracker-chip-Joe'

# Open rare menu
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500

# Tap Stall (offense) - records throw from disc holder directly
- tapOn:
    id: 'rare-menu-stall-offense'

# Stall-offense records turnover -> opponent now has disc
- waitForAnimationToEnd:
    timeout: 1500

# Opponent has disc; record opponent goal to end point
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'tracker-next-point'
- tapOn:
    id: 'tracker-next-point'

# Handle line select and pull for new point
- runFlow:
    file: ../flows/select-line-and-pull.yaml

# --- Callahan (requires opponent to have disc) ---
# Tap Joe to start with disc
- tapOn:
    id: 'tracker-chip-Joe'

# Give disc to opponent first
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'

# Now opponent has disc - open rare menu for Callahan
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500

# Select Callahan modifier
- tapOn:
    id: 'rare-menu-callahan'

# Verify modifier prompt
- assertVisible:
    text: 'Tap player who got the Callahan'

# Tap Jon for Callahan
- tapOn:
    id: 'tracker-chip-Jon'

# Verify goal state
- assertVisible:
    id: 'tracker-next-point'
- tapOn:
    id: 'tracker-next-point'

# Handle line select and pull
- runFlow:
    file: ../flows/select-line-and-pull.yaml

# --- Stall (defense - opponent has disc) ---
# Tap Joe to start with disc
- tapOn:
    id: 'tracker-chip-Joe'

# Pass to Jon
- tapOn:
    id: 'tracker-chip-Jon'

# Open rare menu -> Opp D to give opponent disc
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'

# Open rare menu for Stall (defense)
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500

# Select Stall modifier (defense - stalls the opponent)
- tapOn:
    id: 'rare-menu-stall'

# Verify modifier prompt
- assertVisible:
    text: 'Tap player who got the stall'

# Tap Joe for stall (opponent stalled)
- tapOn:
    id: 'tracker-chip-Joe'

# Take screenshot
- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-rare-actions
