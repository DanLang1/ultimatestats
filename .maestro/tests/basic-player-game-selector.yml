appId: com.langdk.ultimatestats.dev
name: Basic Player Game Selector
tags:
  - basic
---
# Saved Games -> Combined Stats (both games) -> player stats -> game selector: picking a game returns to the player's stats
# with that game in the impact chart, and the player screen's back still returns to the box score.
- runFlow: ../flows/setup-basic-saved-games.yaml
- extendedWaitUntil:
    visible:
      id: 'saved-games-screen'
    timeout: 5000
# The seed team has the newest game, so Saved Games opens on it with just the two seeded games.
# Waits for the seeded list and the seed's navigation to settle; a tap during it is dropped.
- extendedWaitUntil:
    visible: '2 GAMES'
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: 'header-action-select'
- extendedWaitUntil:
    visible:
      id: 'saved-games-select-all'
    timeout: 5000
- tapOn:
    id: 'saved-games-select-all'
- tapOn:
    id: 'saved-games-select-bar-view-stats'
- extendedWaitUntil:
    visible: 'COMBINED STATS'
    timeout: 5000

# Rows are wider than the screen, so tap near the leading name cell.
- scrollUntilVisible:
    element: 'Joe, .*'
    direction: DOWN
    speed: 80
    visibilityPercentage: 40
- tapOn:
    text: 'Joe, .*'
    point: '5%,50%'

# The impact chart defaults to the most recent game (Rivals), whose breakdown includes the
# Rivals-scored point; the Hammers game has no Opp Hold. The game pill exposes only its
# accessibility label, so the breakdown identifies the selected game.
- scrollUntilVisible:
    element: 'Choose game for impact chart'
    direction: DOWN
    speed: 80
- assertVisible: 'Opp Hold'
- tapOn: 'Choose game for impact chart'
- extendedWaitUntil:
    visible: 'SELECT GAME'
    timeout: 5000
- tapOn: '.*vs Hammers.*'
- extendedWaitUntil:
    notVisible: 'SELECT GAME'
    timeout: 5000
- assertVisible: 'Game shown in this chart'
- assertVisible: 'Hold'
- assertNotVisible: 'Opp Hold'

# The game sheet's close animation can swallow an immediate tap.
- waitForAnimationToEnd
- tapOn:
    id: 'screen-header-back'
- extendedWaitUntil:
    visible: 'Joe, .*'
    timeout: 5000

- takeScreenshot:
    path: .maestro/screenshots/basic-player-game-selector
