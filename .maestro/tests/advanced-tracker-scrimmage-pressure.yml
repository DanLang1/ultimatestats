appId: com.langdk.ultimatestats
name: Advanced Tracker Scrimmage Pressure
tags:
  - scrimmage
---
- runFlow:
    file: ../flows/setup-scrimmage.yaml
    env:
      TRACKER_STATE: focusPossession
- runFlow:
    file: ../flows/open-rare-menu.yaml
- assertVisible:
    id: 'rare-menu-pressure'
- tapOn:
    id: 'rare-menu-pressure'
    retryTapIfNoChange: true

- assertVisible:
    text: 'Tap player who applied pressure'
- assertVisible:
    id: 'tracker-chip-Anna'
- tapOn:
    id: 'tracker-chip-Anna'

- extendedWaitUntil:
    visible:
      text: 'PRESSURE'
    timeout: 5000
- assertVisible:
    text: 'ANNA'
- assertVisible:
    id: 'tracker-chip-Anna'
- assertNotVisible:
    id: 'tracker-chip-Joe'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-scrimmage-pressure
