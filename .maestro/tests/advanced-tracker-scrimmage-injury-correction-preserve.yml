appId: com.langdk.ultimatestats
name: Scrimmage Correction Preserves Unaffected Injury Sub
tags:
  - scrimmage
---
- runFlow:
    file: ../flows/setup-scrimmage-clean.yaml
    env:
      TRACKER_STATE: focusPossession
- runFlow:
    file: ../flows/record-light-injury-sub.yaml
- tapOn:
    id: 'stoppage-resume'
- assertVisible:
    id: 'tracker-menu-button'

# Correct a different starter; the Jon -> Heidi injury history should still apply.
- runFlow:
    file: ../flows/open-light-line-correction.yaml
- tapOn:
    id: 'player-chip-Mike'
    selected: true
- tapOn:
    id: 'player-chip-Ivan'
    selected: false
- tapOn:
    id: 'line-select-confirm'
    enabled: true
- tapOn:
    id: 'line-correction-finish'
- assertVisible:
    id: 'tracker-menu-button'

- tapOn:
    id: 'tracker-line-action-tile'
- assertVisible:
    id: 'line-change-injury-sub'
- tapOn:
    id: 'line-change-injury-sub'
- assertVisible:
    text: 'Injury Sub · Light'
- assertVisible:
    id: 'player-chip-Heidi'
    selected: true
- assertVisible:
    id: 'player-chip-Ivan'
    selected: true
- assertVisible:
    id: 'player-chip-Jon'
    selected: false
- assertVisible:
    id: 'player-chip-Mike'
    selected: false

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-scrimmage-injury-correction-preserve
