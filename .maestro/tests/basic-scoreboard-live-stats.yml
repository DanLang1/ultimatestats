appId: com.langdk.ultimatestats.dev
name: Basic Scoreboard Live Stats
tags:
  - basic
---
# Live stats opens over the scoreboard without the hub tab bar, and its timeline opens over live
# stats; back retraces both steps to the scoreboard.
- runFlow: ../flows/setup-basic-game.yaml

- tapOn:
    id: 'scoreboard-view-stats'
- extendedWaitUntil:
    visible: 'CURRENT GAME'
    timeout: 5000
- assertNotVisible:
    id: 'hub-tab-stats'
# maestro-runner finds header-action-timeline here, but its id tap never opened the timeline on
# this scoreboard path (it works from the tracker and by hand). A tap at the button's position does.
- tapOn:
    point: '79%,10%'
- extendedWaitUntil:
    visible: 'GAME TIMELINE'
    timeout: 5000

- tapOn:
    id: 'game-timeline-back'
- extendedWaitUntil:
    visible: 'CURRENT GAME'
    timeout: 5000
- tapOn:
    id: 'screen-header-back'
- extendedWaitUntil:
    visible: 'Score for Zoboomafoo'
    timeout: 5000
- assertNotVisible: 'CURRENT GAME'

# From the Stats list's pinned live game, back returns to the list.
- tapOn:
    id: 'scoreboard-home-button'
- tapOn:
    id: 'hub-tab-stats'
- extendedWaitUntil:
    visible:
      id: 'stats-live-game'
    timeout: 5000
- tapOn:
    id: 'stats-live-game'
- extendedWaitUntil:
    visible: 'CURRENT GAME'
    timeout: 5000
- tapOn:
    id: 'screen-header-back'
- extendedWaitUntil:
    visible: 'SAVED GAMES'
    timeout: 5000
