appId: com.langdk.ultimatestats.dev
# Verifies correction through the loaded live-game timeline.
name: Advanced Tracker Edit Live Completed Touch
tags:
  - extended
---
- runFlow:
    file: ../flows/setup-game-clean.yaml
    env:
      TRACKER_STATE: focusPossession

# Joe starts with the disc. Record a goal to Jon, then open the active game's timeline.
- swipe:
    from:
      id: 'tracker-chip-Jon'
    direction: UP
    duration: 500
- extendedWaitUntil:
    visible:
      id: 'between-point-start-next'
    timeout: 5000
- assertVisible:
    id: 'throw-type-huck'
- assertVisible:
    id: 'tracker-undo-button'
- assertNotVisible:
    id: 'tracker-more-button'
- assertNotVisible:
    id: 'between-point-undo'
- tapOn:
    id: 'throw-type-huck'
- tapOn:
    id: 'tracker-menu-button'
- tapOn:
    id: 'tracker-menu-view-stats'
- extendedWaitUntil:
    visible:
      id: 'advanced-stats-summary-card'
    timeout: 5000
- tapOn:
    id: 'header-action-timeline'
- extendedWaitUntil:
    visible:
      text: 'GAME TIMELINE'
    timeout: 5000
- assertVisible: 'IN PROGRESS'
- assertVisible: 'Edit Joe \+ Jon · Goal, Huck'

# Correct the live game's terminal touch back to the thrower (Joe) for a self-goal.
- tapOn: 'Edit Joe \+ Jon · Goal, Huck'
- assertVisible: 'Edit Touch'
- assertVisible:
    id: 'player-chip-Joe'
- tapOn:
    id: 'player-chip-Joe'
- tapOn:
    id: 'advanced-touch-save'
- extendedWaitUntil:
    visible: 'Edit Joe \+ Joe · Goal, Huck'
    timeout: 5000

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-edit-live-completed-touch
