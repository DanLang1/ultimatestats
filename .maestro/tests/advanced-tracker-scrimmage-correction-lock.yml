appId: com.langdk.ultimatestats.dev
name: Scrimmage Correction Locks Action Players
tags:
  - scrimmage
---
- runFlow:
    file: ../flows/setup-scrimmage-clean.yaml
    env:
      TRACKER_STATE: focusPossession
- runFlow:
    file: ../flows/open-light-line-correction.yaml

# Joe recorded the seeded pickup and cannot be removed from the active line.
- assertVisible:
    id: 'player-chip-lock-Joe'
- tapOn:
    id: 'player-chip-Joe'
    selected: true

- assertVisible:
    text: 'Player locked'
- assertVisible:
    text: 'Joe recorded an action this point and cannot be removed or moved.'
- assertVisible:
    text: 'OK'
- tapOn:
    text: 'OK'
- assertVisible:
    text: 'Correct Current · Light'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-scrimmage-correction-lock
