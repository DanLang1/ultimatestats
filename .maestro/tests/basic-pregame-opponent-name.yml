appId: com.langdk.ultimatestats.dev
name: Basic Pregame Opponent Name Edit
tags:
  - basic
---
- runFlow: ../flows/setup-team-dashboard.yaml
- tapOn:
    id: 'dashboard-new-game-button'
- tapOn:
    id: 'new-game-sheet-basic'
- assertVisible:
    text: 'BASIC SCOREBOARD'

# Edit the opponent name inline, mirroring the advanced-tracker keyboard test.
- scrollUntilVisible:
    element:
      id: 'basic-opponent-name-edit'
    direction: DOWN
- tapOn:
    id: 'basic-opponent-name-edit'
- assertVisible:
    id: 'basic-opponent-name-input'
- eraseText
- inputText: 'ChicagoUnion'
- assertVisible:
    id: 'basic-opponent-name-input'
    text: 'ChicagoUnion'

# Submitting via the keyboard Done key commits the draft through
# useOpponentNameDraft (onSubmitEditing). Edit mode exits and the segment
# label shows the committed name.
- tapOn: 'Done'
- assertNotVisible:
    id: 'basic-opponent-name-input'
- assertVisible: 'ChicagoUnion'

- takeScreenshot:
    path: .maestro/screenshots/basic-pregame-opponent-name
