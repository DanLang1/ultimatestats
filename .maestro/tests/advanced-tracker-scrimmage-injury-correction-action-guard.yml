appId: com.langdk.ultimatestats.dev
name: Scrimmage Correction Preserves Injury Sub
tags:
  - scrimmage
---
- runFlow:
    file: ../flows/setup-scrimmage-clean.yaml
    env:
      TRACKER_STATE: focusPossession
- runFlow:
    file: ../flows/record-light-injury-sub.yaml
- tapOn:
    id: 'stoppage-resume'
- assertVisible:
    id: 'tracker-chip-Heidi'

# The correction starts from the active line and locks both statuses recorded by the injury sub.
- runFlow:
    file: ../flows/open-light-line-correction.yaml
- assertVisible:
    id: 'player-chip-lock-Heidi'
- assertVisible:
    id: 'player-chip-lock-Jon'
- tapOn:
    id: 'player-chip-Jon'

- assertVisible:
    text: 'Player locked'
- assertVisible:
    text: "Jon's status is preserved by a recorded injury substitution."

- tapOn:
    text: 'OK'
- assertVisible:
    text: 'Correct Current · Light'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-scrimmage-injury-correction-action-guard
