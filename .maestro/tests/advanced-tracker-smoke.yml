appId: com.langdk.ultimatestats
name: Advanced Tracker Smoke
---
- runFlow:
    file: ../flows/setup-game.yaml

# Start with disc on Joe
- tapOn:
    id: 'tracker-chip-Joe'

# Pass to Jon
- tapOn:
    id: 'tracker-chip-Jon'

# Assert pass chain shows Joe (the thrower)
- assertVisible:
    text: 'JOE'

# Pass to Mike
- tapOn:
    id: 'tracker-chip-Mike'

# Assert pass chain shows Jon
- assertVisible:
    text: 'JON'

# Open rare menu and record opponent block
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'

# Verify defense actions appear
- assertVisible:
    id: 'defense-opp-goal'

# Record opponent goal
- tapOn:
    id: 'defense-opp-goal'

# Verify point end
- assertVisible:
    id: 'between-point-start-next'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-smoke
