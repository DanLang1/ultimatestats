appId: com.langdk.ultimatestats.dev
name: Advanced Tracker Smoke
tags:
  - smoke
---
- runFlow:
    file: ../flows/setup-game.yaml
    env:
      TRACKER_STATE: focusPossession

# Pass to Jon
- tapOn:
    id: 'tracker-chip-Jon'

# Assert pass chain shows Joe (the thrower)
- assertVisible:
    text: 'JOE'

# Pass to Mike
- tapOn:
    id: 'tracker-chip-Mike'

# Assert pass chain shows Jon
- assertVisible:
    text: 'JON'

# Open rare menu and record opponent block
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml

# Verify defense actions appear
- assertVisible:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'defense-opp-turn'

# Record opponent goal and verify point end
- runFlow:
    file: ../flows/record-opponent-goal.yaml

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-smoke
