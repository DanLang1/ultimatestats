appId: com.langdk.ultimatestats.dev
name: Advanced Tracker Menus and Navigation
---
- runFlow:
    file: ../flows/setup-game.yaml
    env:
      TRACKER_STATE: focusPossession

# Open tracker menu
- tapOn:
    id: 'tracker-menu-button'

# Verify menu options
- assertVisible:
    id: 'tracker-menu-view-stats'
- assertVisible:
    id: 'tracker-menu-home'
- assertVisible:
    id: 'tracker-menu-game-note'

# Add a private game note
- tapOn:
    id: 'tracker-menu-game-note'
- assertVisible: 'Game Note'
- tapOn:
    id: 'advanced-game-note-input'
- inputText: 'Wind picked up after halftime.'
- tapOn:
    id: 'advanced-game-note-save'
- assertVisible:
    id: 'tracker-menu-button'

# Verify the menu marks the note as added
- tapOn:
    id: 'tracker-menu-button'
- assertVisible: '.*ADDED.*'

# Navigate to View Stats
- tapOn:
    id: 'tracker-menu-view-stats'

# Verify View Stats screen
- assertVisible:
    id: 'advanced-stats-summary-card'
- assertVisible:
    id: 'advanced-stats-score-badge'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-menus-stats

# Go back to tracker
- tapOn:
    id: 'screen-header-back'
    waitToSettleTimeoutMs: 1000
- runFlow:
    when:
      visible:
        id: 'screen-header-back'
    commands:
      - tapOn:
          id: 'screen-header-back'
          waitToSettleTimeoutMs: 1000

# Verify back on tracker
- extendedWaitUntil:
    visible:
      id: 'tracker-menu-button'
    timeout: 5000

# Open menu again and go Home
- tapOn:
    id: 'tracker-menu-button'
- tapOn:
    id: 'tracker-menu-home'

# Verify Dashboard
- assertVisible:
    text: 'DASHBOARD'
- assertVisible:
    id: 'dashboard-resume-game-button'
