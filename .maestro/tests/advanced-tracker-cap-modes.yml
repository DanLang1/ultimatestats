appId: com.langdk.ultimatestats
name: Advanced Tracker Cap Modes
---
- runFlow:
    file: ../flows/setup-cap-mode.yaml
    env:
      CAP_MODE: both
- assertVisible:
    id: 'tracker-cap-bar'
- assertVisible:
    id: 'tracker-cap-label'
    text: 'SOFT CAP'

- runFlow:
    file: ../flows/setup-cap-mode.yaml
    env:
      CAP_MODE: hard
- assertVisible:
    id: 'tracker-cap-bar'
- assertVisible:
    id: 'tracker-cap-label'
    text: 'HARD CAP'

- runFlow:
    file: ../flows/setup-cap-mode.yaml
    env:
      CAP_MODE: soft
- assertVisible:
    id: 'tracker-cap-bar'
- assertVisible:
    id: 'tracker-cap-label'
    text: 'SOFT CAP'

- runFlow:
    file: ../flows/setup-cap-mode.yaml
    env:
      CAP_MODE: softActive
- assertVisible:
    id: 'tracker-cap-bar'
- assertVisible:
    id: 'tracker-cap-label'
    text: 'SOFT CAP ACTIVE'

- runFlow:
    file: ../flows/setup-cap-mode.yaml
    env:
      CAP_MODE: bothActive
- assertVisible:
    id: 'tracker-cap-bar'
- assertVisible:
    id: 'tracker-cap-label'
    text: 'HARD CAP'

- runFlow:
    file: ../flows/setup-cap-mode.yaml
    env:
      CAP_MODE: none
- assertNotVisible:
    id: 'tracker-cap-bar'
