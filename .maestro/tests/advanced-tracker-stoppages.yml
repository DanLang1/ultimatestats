appId: com.langdk.ultimatestats
name: Advanced Tracker Stoppages
---
- runFlow:
    file: ../flows/setup-game.yaml

# Start with disc on Joe
- tapOn:
    id: 'tracker-chip-Joe'

# --- Injury Substitution ---
- tapOn:
    id: 'tracker-line-action-tile'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'line-change-injury-sub'
- assertVisible:
    text: 'Injury Sub'

# Go back without changes
- tapOn:
    id: 'line-select-back'
# Verify back on tracker
- assertVisible:
    id: 'tracker-menu-button'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-stoppages
