appId: com.langdk.ultimatestats
name: Advanced Tracker Score Bar
---
- runFlow:
    file: ../flows/setup-game.yaml

# Start with disc on Joe
- tapOn:
    id: 'tracker-chip-Joe'

# Pause via score bar
- tapOn:
    id: 'scorebar-pause'
- assertVisible:
    text: 'PAUSED'

# Resume
- tapOn:
    id: 'stoppage-resume'
# Verify back on tracker
- assertVisible:
    id: 'tracker-menu-button'

# Expand score bar to reveal timeout buttons
- tapOn:
    id: 'timeout-dots-focus'
- waitForAnimationToEnd:
    timeout: 500

# Verify timeout buttons
- assertVisible:
    id: 'timeout-button-home'
- assertVisible:
    id: 'timeout-button-away'

# Call home timeout
- tapOn:
    id: 'timeout-button-home'
    retryTapIfNoChange: true
- assertVisible:
    text: 'TIMEOUT'

# Resume
- tapOn:
    id: 'stoppage-resume'
# Verify back on tracker
- assertVisible:
    id: 'tracker-menu-button'

# Undo last action - pass to Jon then undo
- tapOn:
    id: 'tracker-chip-Jon'
- tapOn:
    id: 'tracker-undo-button'

# Verify undo worked - pass chain cleared, only pickup remains
- assertVisible:
    text: 'HAS DISC'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-scorebar
