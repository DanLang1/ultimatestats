appId: com.langdk.ultimatestats
name: Advanced Tracker View Stats Mid-Point
---
- runFlow:
    file: ../flows/setup-game.yaml

# Start with disc on Joe
- tapOn:
    id: 'tracker-chip-Joe'

# Pass to Jon (creates a completion, giving Joe stats mid-point)
- tapOn:
    id: 'tracker-chip-Jon'

# Open tracker menu and navigate to View Stats mid-point
- tapOn:
    id: 'tracker-menu-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'tracker-menu-view-stats'

# Verify View Stats screen
- assertVisible:
    id: 'advanced-stats-summary-card'
- assertVisible:
    id: 'advanced-stats-score-badge'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-view-stats-midpoint

# Swipe down on left side to reveal player table rows
- swipe:
    start: 20%, 70%
    end: 20%, 30%
    duration: 500
- swipe:
    start: 20%, 70%
    end: 20%, 30%
    duration: 500

# Verify player row is visible and tap for detail
- assertVisible:
    id: 'advanced-stats-row-joe'
- tapOn:
    id: 'advanced-stats-row-joe'
    retryTapIfNoChange: true

# Verify Player Stats screen
- assertVisible:
    id: 'advanced-player-stats-screen'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-player-stats-midpoint
