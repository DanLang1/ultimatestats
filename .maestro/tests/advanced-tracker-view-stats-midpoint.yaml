appId: com.langdk.ultimatestats.dev
name: Advanced Tracker View Stats Mid-Point
---
- runFlow:
    file: ../flows/setup-game.yaml

# Start with disc on Joe
- tapOn:
    id: 'tracker-chip-Joe'

# Pass to Jon (creates a completion, giving Joe stats mid-point)
- tapOn:
    id: 'tracker-chip-Jon'

# Classify the completed pass as a huck. Successful throws must not offer reset classification.
- assertVisible:
    id: 'throw-type-huck'
- assertNotVisible:
    id: 'throw-type-backfield-reset'
- tapOn:
    id: 'throw-type-huck'

# Open tracker menu and navigate to View Stats mid-point
- tapOn:
    id: 'tracker-menu-button'
- tapOn:
    id: 'tracker-menu-view-stats'

# Verify View Stats screen
- assertVisible:
    id: 'advanced-stats-summary-card'
- assertVisible:
    id: 'advanced-stats-score-badge'

# Verify the team classification card and player comparison group.
- scrollUntilVisible:
    element:
      id: 'advanced-throw-types-card'
    direction: DOWN
    centerElement: true
- assertVisible:
    text: 'HUCKS'
- scrollUntilVisible:
    element:
      id: 'advanced-stats-group-types'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'advanced-stats-group-types'
- assertVisible:
    id: 'advanced-stats-column-huck-attempts'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-view-stats-midpoint

# Center the player row so the persistent tab bar cannot cover the tap target
- scrollUntilVisible:
    element:
      id: 'advanced-stats-row-joe'
    direction: DOWN
    centerElement: true

# Tap the player row for detail
- tapOn:
    id: 'advanced-stats-row-joe'
    retryTapIfNoChange: true

# Verify Player Stats screen
- assertVisible:
    id: 'advanced-player-stats-screen'
- scrollUntilVisible:
    element:
      id: 'advanced-player-throw-types-card'
    direction: DOWN
    centerElement: true
- assertVisible:
    text: 'HUCK THROWING'
- assertVisible:
    text: '100%'
- assertVisible:
    text: '1 of 1'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-player-stats-midpoint
