appId: com.langdk.ultimatestats
name: Advanced Tracker Defense Actions
---
- runFlow:
    file: ../flows/setup-game.yaml

# Start with disc on Joe
- tapOn:
    id: 'tracker-chip-Joe'

# Open rare menu and record opponent block
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'

# Verify defense actions appear
- assertVisible:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'defense-opp-turn'

# Record opponent goal
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# Point 2: Repeat defense flow
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-defense
