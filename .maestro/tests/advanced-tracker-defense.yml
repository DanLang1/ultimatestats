appId: com.langdk.ultimatestats
name: Advanced Tracker Defense Actions
tags:
  - extended
---
- runFlow:
    file: ../flows/setup-game.yaml
    env:
      TRACKER_STATE: focusPossession

# Open rare menu and record opponent block
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml

# Verify defense actions appear
- assertVisible:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'defense-opp-turn'

# Record opponent goal
- runFlow:
    file: ../flows/record-opponent-goal.yaml
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# Point 2: Repeat defense flow
- tapOn:
    id: 'tracker-chip-Joe'
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml
- runFlow:
    file: ../flows/record-opponent-goal.yaml

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-defense
