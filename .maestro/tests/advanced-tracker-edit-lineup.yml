appId: com.langdk.ultimatestats.dev
name: Advanced Tracker Edit Completed Point Lineup
tags:
  - extended
---
- runFlow:
    file: ../flows/setup-game-clean.yaml
    env:
      TRACKER_STATE: focusPossession

- swipe:
    from:
      id: 'tracker-chip-Jon'
    direction: UP
    duration: 500
- extendedWaitUntil:
    visible:
      id: 'between-point-start-next'
    timeout: 5000
- tapOn:
    id: 'tracker-menu-button'
- tapOn:
    id: 'tracker-menu-end-game'
- extendedWaitUntil:
    visible:
      id: 'game-complete-finish'
    timeout: 5000
- tapOn:
    id: 'game-complete-finish'
- extendedWaitUntil:
    visible:
      id: 'advanced-stats-summary-card'
    timeout: 10000
- tapOn:
    id: 'header-actions-menu'
- tapOn:
    id: 'header-menu-timeline'
- extendedWaitUntil:
    visible:
      text: 'GAME TIMELINE'
    timeout: 5000
- tapOn:
    id: 'advanced-edit-point-line-1'
- extendedWaitUntil:
    visible:
      text: 'Edit Line'
    timeout: 5000
- tapOn:
    id: 'line-select-back'
- assertVisible:
    text: 'GAME TIMELINE'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-edit-lineup
