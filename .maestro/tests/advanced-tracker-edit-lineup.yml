appId: com.langdk.ultimatestats.dev
name: Advanced Tracker Edit Completed Point Lineup
tags:
  - extended
---
- runFlow:
    file: ../flows/setup-scrimmage-clean.yaml
    env:
      TRACKER_STATE: focusPossession

- swipe:
    from:
      id: 'tracker-chip-Jon'
    direction: UP
    duration: 500
- extendedWaitUntil:
    visible:
      id: 'between-point-start-next'
    timeout: 5000
- tapOn:
    id: 'tracker-menu-button'
- tapOn:
    id: 'tracker-menu-end-game'
- extendedWaitUntil:
    visible:
      id: 'game-complete-finish'
    timeout: 5000
- tapOn:
    id: 'game-complete-finish'
- extendedWaitUntil:
    visible:
      id: 'advanced-stats-summary-card'
    timeout: 10000
- tapOn:
    id: 'header-actions-menu'
- tapOn:
    id: 'header-menu-timeline'
- extendedWaitUntil:
    visible:
      text: 'GAME TIMELINE'
    timeout: 5000
- tapOn:
    id: 'advanced-edit-point-line-1'
- extendedWaitUntil:
    visible:
      text: 'Correct Final · Light'
    timeout: 5000

# Swap a benched player into the final Light lineup and save both sides.
# Joe (seeded pickup) and Jon (swipe goal) recorded actions and stay locked.
- tapOn:
    id: 'player-chip-Mike'
    selected: true
- tapOn:
    id: 'player-chip-Heidi'
    selected: false
- tapOn:
    id: 'line-select-confirm'
    enabled: true
- tapOn:
    id: 'line-correction-finish'

# The timeline lineup block reflects the corrected final lineup.
- extendedWaitUntil:
    visible:
      text: 'GAME TIMELINE'
    timeout: 5000
- assertVisible:
    text: 'Heidi'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-edit-lineup
