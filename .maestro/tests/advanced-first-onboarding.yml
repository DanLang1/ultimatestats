appId: com.langdk.ultimatestats.dev
name: Advanced First Onboarding
tags:
  - advanced
  - extended
---
- launchApp
# Retry once: a deep link sent during app cold start can be dropped.
# maxRetries counts total attempts in maestro-runner but retries in Maestro; 2 retries in both.
- retry:
    maxRetries: 2
    commands:
      - openLink: ultimatestats-dev:///__maestro_seed__?mode=onboarding
      - extendedWaitUntil:
          visible:
            id: 'maestro-setup-running'
          timeout: 5000
- retry:
    maxRetries: 1
    commands:
      - extendedWaitUntil:
          notVisible:
            id: 'maestro-setup-running'
          timeout: 15000
- extendedWaitUntil:
    visible: 'Open-Source Ultimate Frisbee Stat Tracker'
    timeout: 15000
- tapOn: 'See How It Works'

- assertVisible:
    id: 'tutorial-line-select-screen'
- tapOn:
    id: 'line-select-quick-preset-tutorial-d-line'
- assertVisible:
    id: 'line-select-confirm'
- tapOn:
    id: 'line-select-confirm'

- assertVisible: 'STEP 1 OF 5'
- tapOn:
    id: 'tracker-chip-Rachel'
- assertVisible: 'STEP 2 OF 5'
- tapOn:
    id: 'tracker-chip-Mark'
- assertVisible: 'STEP 3 OF 5'
- tapOn:
    id: 'offense-throwaway'
- assertVisible: 'STEP 4 OF 5'
- tapOn:
    id: 'tracker-more-button'
- tapOn:
    id: 'tutorial-pressure-action'
- tapOn:
    id: 'tracker-chip-Harper'
- assertVisible: 'STEP 5 OF 5'
- tapOn:
    id: 'offense-goal'
- assertVisible: 'Tap who scored'
- tapOn:
    id: 'tracker-chip-Kelly'

- assertVisible: 'Advanced Tutorial Complete'
- assertVisible: 'Swipes work too.*'
- tapOn: 'DONE'
- extendedWaitUntil:
    visible: 'New Game'
    timeout: 10000
- takeScreenshot:
    path: .maestro/screenshots/advanced-first-onboarding
