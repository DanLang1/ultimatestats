appId: com.langdk.ultimatestats
name: Advanced Tracker View Stats
tags:
  - extended
---
- runFlow:
    file: ../flows/setup-game-clean.yaml

# --- Point 1: Opponent goal ---
- tapOn:
    id: 'tracker-chip-Joe'
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml
- runFlow:
    file: ../flows/record-opponent-goal.yaml
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# Open tracker menu and navigate to View Stats
- tapOn:
    id: 'tracker-menu-button'
- tapOn:
    id: 'tracker-menu-view-stats'

# Verify View Stats content
- assertVisible:
    id: 'advanced-stats-summary-card'
- assertVisible:
    id: 'advanced-stats-score-badge'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-view-stats
