appId: com.langdk.ultimatestats
name: Advanced Tracker View Stats
---
- runFlow:
    file: ../flows/setup-game.yaml

# --- Point 1: Opponent goal ---
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# --- Point 2: Opponent goal ---
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# --- Point 3: Opponent goal ---
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# Open tracker menu and navigate to View Stats
- tapOn:
    id: 'tracker-menu-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'tracker-menu-view-stats'

# Verify View Stats content
- assertVisible:
    id: 'advanced-stats-summary-card'
- assertVisible:
    id: 'advanced-stats-score-badge'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-view-stats
