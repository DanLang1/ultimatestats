appId: com.langdk.ultimatestats
name: Advanced Tracker Turnover Scenarios
---
- runFlow:
    file: ../flows/setup-game.yaml

# --- 50/50 Turnover ---
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-chip-Jon'

# Open rare menu, select 50/50
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- assertVisible:
    id: 'rare-menu-50-50'
- tapOn:
    id: 'rare-menu-50-50'

# Verify modifier prompt
- assertVisible:
    text: 'Tap other player at fault'

# Tap Mike for 50/50 attribution
- tapOn:
    id: 'tracker-chip-Mike'

# Verify turnover label (50/50 appears in turnover header)
- assertVisible:
    text: '50/50'

# Tap Joe to pick up disc
- tapOn:
    id: 'tracker-chip-Joe'
- waitForAnimationToEnd:
    timeout: 500

# --- Opponent Block ---
# Pass to Jon
- tapOn:
    id: 'tracker-chip-Jon'

# Open rare menu, select Opp D
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- assertVisible:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'rare-menu-opp-d'

# Verify on tracker after opponent block
- assertVisible:
    id: 'tracker-menu-button'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-turnovers
