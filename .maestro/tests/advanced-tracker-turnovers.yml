appId: com.langdk.ultimatestats.dev
name: Advanced Tracker Turnover Scenarios
---
- runFlow:
    file: ../flows/setup-game-clean.yaml
    env:
      TRACKER_STATE: focusPossession

# --- 50/50 Turnover ---
- tapOn:
    id: 'tracker-chip-Jon'

# Open rare menu, select 50/50
- runFlow:
    file: ../flows/open-rare-menu.yaml
- assertVisible:
    id: 'rare-menu-50-50'
- tapOn:
    id: 'rare-menu-50-50'
    retryTapIfNoChange: true

# Verify modifier prompt
- assertVisible:
    text: 'Tap other player at fault'

# Tap Mike for 50/50 attribution
- tapOn:
    id: 'tracker-chip-Mike'

# Verify turnover label (50/50 appears in turnover header)
- assertVisible:
    text: '50/50'

# Tap Joe to pick up disc
- tapOn:
    id: 'tracker-chip-Joe'

# --- Opponent Block ---
# Pass to Jon
- tapOn:
    id: 'tracker-chip-Jon'

# Open rare menu, select Opp D
- runFlow:
    file: ../flows/open-rare-menu.yaml
- runFlow:
    file: ../flows/select-opponent-block.yaml

# Verify on tracker after opponent block
- assertVisible:
    id: 'tracker-menu-button'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-turnovers
