appId: com.langdk.ultimatestats
name: Advanced Tracker Pull Tracking
---
- runFlow:
    file: ../flows/setup-game.yaml

# === Point 1: THEY pull (auto inbound) ===
# Start with disc, then give opponent a goal so we're back on offense for the test
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'
- tapOn:
    id: 'defense-opp-goal'
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

- runFlow:
    file: ../flows/select-line-and-pull.yaml

# === Point 2: WE pull (Callahan → we score → we pull next) ===
# Need us to score so WE pull next point. Give opponent disc, then Callahan.
- tapOn:
    id: 'tracker-chip-Joe'
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-opp-d'

# Now opponent has disc. Open rare menu for Callahan.
- tapOn:
    id: 'tracker-more-button'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'rare-menu-callahan'

# Verify Callahan prompt
- assertVisible:
    text: 'Tap player who got the Callahan'

# Tap Jon for Callahan
- tapOn:
    id: 'tracker-chip-Jon'

# Goal state - we scored
- assertVisible:
    id: 'between-point-start-next'
- tapOn:
    id: 'between-point-start-next'

# === Point 3: WE pull → pull result screen appears ===
# Now we pull because we scored last point
- assertVisible:
    text: 'Select Line'
- tapOn:
    id: 'player-chip-Joe'
- tapOn:
    id: 'player-chip-Jon'
- tapOn:
    id: 'player-chip-Mike'
- tapOn:
    id: 'player-chip-Molly'
- tapOn:
    id: 'player-chip-Kelly'
- tapOn:
    id: 'player-chip-Rachel'
- tapOn:
    id: 'player-chip-Joel'
- tapOn:
    id: 'line-select-confirm'

# Verify pull timing for our pull
- assertVisible:
    text: 'WE ARE PULLING'
- tapOn:
    id: 'pull-skip-timing'

# Verify all pull result options are present
- assertVisible:
    id: 'pull-result-inbound'
- assertVisible:
    id: 'pull-result-ob'
- assertVisible:
    id: 'pull-result-dropped'

# Select out-of-bounds
- tapOn:
    id: 'pull-result-ob'

# Wait for tracker (opponent has disc after our OB pull)
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: 'tracker-menu-button'

- takeScreenshot:
    path: .maestro/screenshots/advanced-tracker-pull-tracking
